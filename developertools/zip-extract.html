<!DOCTYPE html>

<style>

</style></head><body>
<header><h1>📂 Nexora Zip Extractor</h1><button id="dark" title="Dark mode">🌙</button><button id="again" style="display:none">New zip</button></header>

<div id="drop"><div class="ic">🗂️</div><b>Choose a .zip file</b>Tap here or drop a zip.<br><small>Nothing is uploaded. It all stays on your phone.</small>
<input id="file" type="file" accept=".zip,application/zip" hidden></div>

<div id="app">
  <div id="bar"><input id="q" placeholder="🔍 Search files…"><button class="g sm" id="sm" title="Search in names or inside file contents">Names</button><button id="site" class="sm">▶ Site</button></div>
  <div id="bar2"><select id="sort"><option value="folder">Sort: By folder</option><option value="name">Sort: Name</option><option value="size">Sort: Largest first</option><option value="type">Sort: Type</option></select><button class="g sm" id="zipall">⬇ Zip these files</button></div>
  <div id="count"></div>
  <div id="list"></div>
  <div id="view">
    <div id="vh"><div id="vn"></div>
      <button class="g sm" id="prev">◀</button><button class="g sm" id="next">▶</button>
      <button class="tab g sm" id="tCode">Code</button><button class="tab g sm" id="tPrev">Preview</button>
      <button class="g sm" id="fmt">{ } Format</button>
      <button class="g sm" id="copy">📋 Copy</button><button class="g sm" id="open">↗ Open</button><button class="g sm" id="dl">⬇ Download</button></div>
    <div id="find"><input id="ff" placeholder="Find in file…"><button class="g sm" id="fn">↓</button><button class="g sm" id="wrap" title="Wrap lines">↩</button><button class="g sm" id="fm">A−</button><button class="g sm" id="fp">A+</button></div>
    <div id="cw"><pre id="gut"></pre><pre id="code"></pre></div>
    <div id="pv"><div id="pvbar"><button class="g" id="exit">✕ Exit</button><span id="pvt"></span></div>
      <iframe id="frame" sandbox="allow-scripts"></iframe></div>
    <div id="imgw"><img id="img" alt=""></div><div id="media"></div><div class="note" id="note"></div>
    <div id="fsrow" style="display:none;padding:10px 14px"><button id="fs" style="width:100%">⛶ Full screen preview</button></div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ---------- minimal zip reader (no libraries) ---------- */
async function inflateRaw(bytes) {
  const ds = new DecompressionStream('deflate-raw');
  const w = ds.writable.getWriter(); w.write(bytes); w.close();
  return new Uint8Array(await new Response(ds.readable).arrayBuffer());
}
async function unzip(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--)
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error('This is not a valid zip file.');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder(), out = [];
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('Zip is damaged.');
    const flags = dv.getUint16(p + 8, true), method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true), size = dv.getUint32(p + 24, true);
    const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    const off = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nl));
    p += 46 + nl + el + cl;
    if (name.endsWith('/') || name.startsWith('__MACOSX/') || name.endsWith('.DS_Store')) continue;
    out.push({
      name, size, method,
      async read() {
        if (flags & 1) throw new Error('This file is password-protected and cannot be opened.');
        if (csize === 0xFFFFFFFF || off === 0xFFFFFFFF) throw new Error('ZIP64 files are not supported.');
        const lnl = dv.getUint16(off + 26, true), lel = dv.getUint16(off + 28, true);
        const start = off + 30 + lnl + lel, data = u8.subarray(start, start + csize);
        if (method === 0) return data.slice();
        if (method === 8) return inflateRaw(data);
        throw new Error('Unsupported compression method ' + method);
      }
    });
  }
  return out;
}

/* ---------- minimal zip writer (store only) ---------- */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u) { let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(items) {
  const enc = new TextEncoder(), parts = [], cen = []; let off = 0;
  const d = new Date(), time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1),
    date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const it of items) {
    const nb = enc.encode(it.name), crc = crc32(it.data), sz = it.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true); lh.setUint32(18, sz, true);
    lh.setUint32(22, sz, true); lh.setUint16(26, nb.length, true); lh.setUint16(28, 0, true);
    parts.push(lh.buffer, nb, it.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true); ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, sz, true); ch.setUint32(24, sz, true); ch.setUint16(28, nb.length, true); ch.setUint32(42, off, true);
    cen.push(ch.buffer, nb);
    off += 30 + nb.length + sz;
  }
  let cs = 0; for (const c of cen) cs += c.byteLength;
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, items.length, true); e.setUint16(10, items.length, true);
  e.setUint32(12, cs, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...cen, e.buffer], { type: 'application/zip' });
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const TEXT = /\.(html?|css|js|mjs|json|txt|md|markdown|xml|svg|csv|tsv|ts|tsx|jsx|php|py|java|c|cpp|h|cs|go|rb|rs|sh|yml|yaml|toml|ini|env|log|sql|vue|svelte|htaccess|webmanifest|map)$/i;
const MIME = { html:'text/html', htm:'text/html', css:'text/css', js:'text/javascript', mjs:'text/javascript', json:'application/json',
  svg:'image/svg+xml', png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', webp:'image/webp', ico:'image/x-icon', avif:'image/avif', bmp:'image/bmp',
  woff:'font/woff', woff2:'font/woff2', ttf:'font/ttf', otf:'font/otf', mp4:'video/mp4', webm:'video/webm', mov:'video/quicktime', mp3:'audio/mpeg', wav:'audio/wav', ogg:'audio/ogg', m4a:'audio/mp4', pdf:'application/pdf' };
const ext = n => (n.split('.').pop() || '').toLowerCase();
const mime = n => MIME[ext(n)] || 'application/octet-stream';
const isText = n => TEXT.test(n) || /^[^.]+$/.test(n.split('/').pop());
const fmt = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : n > 1024 ? Math.round(n / 1024) + ' KB' : n + ' B';
const base = n => n.split('/').pop();
const shown = n => strip && n.startsWith(strip) ? n.slice(strip.length) : n;
const COL = { html:'#f97316', htm:'#f97316', css:'#3b82f6', js:'#eab308', mjs:'#eab308', json:'#10b981', md:'#64748b', svg:'#ec4899',
  png:'#ec4899', jpg:'#ec4899', jpeg:'#ec4899', gif:'#ec4899', webp:'#ec4899', py:'#0ea5e9', php:'#8b5cf6', txt:'#64748b',
  csv:'#16a34a', pdf:'#dc2626', mp4:'#7c3aed', mp3:'#0891b2', wav:'#0891b2' };
function toast(t) { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 1500); }
function resolve(base, ref) {
  ref = ref.split('#')[0].split('?')[0];
  try { ref = decodeURIComponent(ref); } catch (e) {}
  const parts = ref.startsWith('/') ? [] : base.split('/').slice(0, -1);
  for (const seg of ref.split('/')) { if (seg === '..') parts.pop(); else if (seg && seg !== '.') parts.push(seg); }
  return parts.join('/');
}
const isExternal = r => /^([a-z][a-z0-9+.-]*:|\/\/|#|data:|mailto:|tel:|javascript:)/i.test(r.trim());
const save = (a, b) => { try { localStorage.setItem(a, b); } catch (e) {} };
const load = a => { try { return localStorage.getItem(a); } catch (e) { return null; } };

/* ---------- persistence (survives refresh) ---------- */
const idb = () => new Promise((res, rej) => { const r = indexedDB.open('nzx', 1); r.onupgradeneeded = () => r.result.createObjectStore('z'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function idbSet(v) { try { const d = await idb(); await new Promise((res, rej) => { const t = d.transaction('z', 'readwrite'); v === null ? t.objectStore('z').delete('zip') : t.objectStore('z').put(v, 'zip'); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch (e) {} }
async function idbGet() { try { const d = await idb(); return await new Promise((res, rej) => { const r = d.transaction('z').objectStore('z').get('zip'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); } catch (e) { return null; } }
function saveState() {
  if (!files.length) return;
  save('nzx-state', JSON.stringify({ cur: current, sort: sortMode, sm: searchMode, q: $('#q').value, col: [...collapsed], prev: $('#pv').style.display === 'block', wrap, fsz }));
}

/* ---------- state ---------- */
let strip = '', files = [], byName = {}, cache = {}, textCache = {}, current = null, currentBytes = null, blobUrls = {};
let sortMode = 'folder', searchMode = 'name', contentHits = null, contentQ = '', order = [];
let rawText = '', isJson = false, jsonPretty = true, wrap = false, fsz = 13, findPos = 0;
const collapsed = new Set();

async function bytesOf(f) { return cache[f.name] || (cache[f.name] = await f.read()); }
async function textOf(f) { return textCache[f.name] ?? (textCache[f.name] = new TextDecoder().decode(await bytesOf(f))); }

async function loadZip(file, restoring) {
  try {
    files = await unzip(await file.arrayBuffer());
  } catch (e) { if (!restoring) alert(e.message); return false; }
  if (!files.length) { if (!restoring) alert('The zip is empty.'); return false; }
  if (!restoring) { idbSet(file); save('nzx-state', ''); }
  files.sort((a, b) => base(a.name).localeCompare(base(b.name), undefined, { numeric: true, sensitivity: 'base' }) || a.name.localeCompare(b.name));
  byName = {}; cache = {}; textCache = {}; blobUrls = {}; current = null; contentHits = null;
  collapsed.clear();
  files.forEach(f => byName[f.name] = f);
  const tops = new Set(files.map(f => f.name.split('/')[0]));
  strip = tops.size === 1 && files.every(f => f.name.includes('/')) ? [...tops][0] + '/' : '';
  $('#drop').style.display = 'none'; $('#app').style.display = 'block'; $('#again').style.display = '';
  $('#view').style.display = 'none'; $('#q').value = '';
  $('#site').style.display = files.some(f => /\.html?$/i.test(f.name)) ? '' : 'none';
  renderList();
  return true;
}

/* ---------- list, search, sort ---------- */
function filtered() {
  const q = $('#q').value.toLowerCase();
  if (!q) return files.slice();
  if (searchMode === 'content' && contentHits && contentQ === q) return files.filter(f => contentHits.has(f.name));
  return files.filter(f => shown(f.name).toLowerCase().includes(q));
}
let stok = 0;
async function runContent() {
  const q = $('#q').value.toLowerCase(), tok = ++stok;
  if (searchMode !== 'content' || q.length < 2) { contentHits = null; renderList(); return; }
  $('#count').textContent = 'Searching inside files…';
  const hs = new Set();
  for (const f of files) {
    if (tok !== stok) return;
    if (shown(f.name).toLowerCase().includes(q)) { hs.add(f.name); continue; }
    if (!isText(f.name) || f.size > 2e6) continue;
    try { if ((await textOf(f)).toLowerCase().includes(q)) hs.add(f.name); } catch (e) {}
  }
  if (tok !== stok) return;
  contentHits = hs; contentQ = q; renderList();
}
const cmpName = (a, b) => base(a.name).localeCompare(base(b.name), undefined, { numeric: true, sensitivity: 'base' });
function rowFor(f, flat) {
  const e = ext(f.name), r = document.createElement('div'); r.className = 'row' + (current === f.name ? ' sel' : '');
  r.innerHTML = '<div class="badge"></div><div class="fn"></div><div class="sz">' + fmt(f.size) + '</div>';
  r.children[0].textContent = (e || 'FILE').slice(0, 4).toUpperCase(); r.children[0].style.background = COL[e] || '#94a3b8';
  r.children[1].textContent = flat ? shown(f.name) : base(f.name);
  r.onclick = () => openFile(f.name); order.push(f.name); return r;
}
function renderList() {
  const q = $('#q').value, box = $('#list'); box.innerHTML = ''; order = [];
  const hit = filtered(), tot = hit.reduce((s, f) => s + f.size, 0);
  $('#count').textContent = (q ? hit.length + ' of ' + files.length : hit.length) + ' file' + (hit.length === 1 ? '' : 's') + ' · ' + fmt(tot);
  if (sortMode !== 'folder') {
    const s = hit.slice();
    s.sort(sortMode === 'size' ? (a, b) => b.size - a.size
      : sortMode === 'type' ? (a, b) => ext(a.name).localeCompare(ext(b.name)) || cmpName(a, b) : cmpName);
    s.forEach(f => box.appendChild(rowFor(f, true))); return;
  }
  const groups = {};
  hit.forEach(f => { const p = shown(f.name), d = p.includes('/') ? p.slice(0, p.lastIndexOf('/')) : ''; (groups[d] = groups[d] || []).push(f); });
  Object.keys(groups).sort((x, y) => !x ? -1 : !y ? 1 : x.localeCompare(y, undefined, { numeric: true, sensitivity: 'base' })).forEach(d => {
    const open = q || !collapsed.has(d);
    if (d || Object.keys(groups).length > 1) {
      const h = document.createElement('div'); h.className = 'grp';
      h.innerHTML = '<span>' + (open ? '📂' : '📁') + '</span><b></b><i>' + groups[d].length + '</i>';
      h.children[1].textContent = d || 'Main folder';
      h.onclick = () => { collapsed.has(d) ? collapsed.delete(d) : collapsed.add(d); renderList(); saveState(); };
      box.appendChild(h);
    }
    if (!open) return;
    groups[d].sort(cmpName).forEach(f => box.appendChild(rowFor(f, false)));
  });
}

/* ---------- viewer ---------- */
function hideAll() {
  ['#cw', '#pv', '#fsrow', '#imgw', '#media', '#note', '#find'].forEach(s => $(s).style.display = 'none');
  $('#media').replaceChildren(); $('#img').classList.remove('zoom');
  if (window.CSS && CSS.highlights) CSS.highlights.delete('hit');
}
function hex(b) {
  const n = Math.min(b.length, 2048), o = [];
  for (let i = 0; i < n; i += 16) {
    const s = b.subarray(i, Math.min(i + 16, n));
    o.push(i.toString(16).padStart(6, '0') + '  ' + [...s].map(x => x.toString(16).padStart(2, '0')).join(' ').padEnd(47) + '  ' + [...s].map(x => x > 31 && x < 127 ? String.fromCharCode(x) : '.').join(''));
  }
  return o.join('\n');
}
function renderText() {
  let t = rawText, extra = '';
  if (isJson && jsonPretty) { try { t = JSON.stringify(JSON.parse(rawText), null, 2); } catch (e) {} }
  if (t.length > 1e6) { t = t.slice(0, 1e6); extra = 'Showing the first 1 MB only. Use Download for the full file.'; }
  $('#code').textContent = t;
  const n = t.split('\n').length;
  $('#gut').textContent = Array.from({ length: n }, (_, i) => i + 1).join('\n');
  $('#note').textContent = extra; $('#note').style.display = extra ? 'block' : 'none';
  $('#fmt').classList.toggle('on', isJson && jsonPretty);
}
function applyView() {
  $('#cw').style.setProperty('--fs', fsz + 'px');
  $('#code').classList.toggle('wrap', wrap); $('#gut').style.display = wrap ? 'none' : '';

async function openFile(name, mode) {

  const img = /^image\//.test(m) && !svg, av = /^(audio|video)\//.test(m), pdf = e === 'pdf', text = isText(name);

function showCode() { exitFull(); $('#pv').style.display = 'none'; $('#fsrow').style.display = 'none'; $('#cw').style.display = 'flex'; $('#find').style.display = 'flex'; tabs('tCode'); saveState(); }
function tabs(id) { document.querySelectorAll('.tab').forEach(t => { if (t.id !== 'wrap') t.classList.toggle('on', t.id === id); }); }

/* ---------- find in file ---------- */
function findNext(fresh) {

  if (window.CSS && CSS.highlights) CSS.highlights.delete('hit');
  if (!q || !node) return;
  const t = node.data.toLowerCase(), needle = q.toLowerCase();
  if (fresh) findPos = 0;
  let i = t.indexOf(needle, findPos);
  if (i < 0 && findPos > 0) { i = t.indexOf(needle); if (i >= 0) toast('Wrapped to start'); }
  if (i < 0) { toast('Not found'); return; }
  findPos = i + q.length;

  if (window.CSS && CSS.highlights && window.Highlight) CSS.highlights.set('hit', new Highlight(r));
  else { const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  const cw = $('#cw'), rr = r.getBoundingClientRect(), cr = cw.getBoundingClientRect();
  cw.scrollTop += rr.top - cr.top - cw.clientHeight / 3;
  if (rr.left < cr.left + 50 || rr.right > cr.right) cw.scrollLeft += rr.left - cr.left - 60;

/* ---------- live preview ---------- */
async function blobFor(name, stack = []) {
  if (blobUrls[name]) return blobUrls[name];

  let b = await bytesOf(f);
  if (ext(name) === 'css') b = new TextEncoder().encode(await rewriteCss(new TextDecoder().decode(b), name, [...stack, name]));
  return blobUrls[name] = URL.createObjectURL(new Blob([b], { type: mime(name) }));
}

  const re = /url\(\s*(['"]?)([^'")]+)\1\s*\)|@import\s+(['"])([^'"]+)\3/g; let out = '', last = 0, m;

    const u = await blobFor(resolve(base, ref), stack);
    out += u ? (m[2] ? 'url("' + u + '")' : '@import "' + u + '"') : m[0];

}
async function processHtml(src, name) {

    }
  }
  for (const st of doc.querySelectorAll('style')) st.textContent = await rewriteCss(st.textContent, name, [name]);
  for (const el of doc.querySelectorAll('[style]')) el.setAttribute('style', await rewriteCss(el.getAttribute('style'), name, [name]));
  for (const a of doc.querySelectorAll('a[href]')) {
    const v = a.getAttribute('href'); if (isExternal(v)) { if (!v.startsWith('#')) a.target = '_blank'; continue; }
    const t = resolve(name, v); if (byName[t]) { a.setAttribute('data-nav', t); a.setAttribute('href', '#'); }
  }
  const s = doc.createElement('script');
  s.textContent = "document.addEventListener('click',e=>{const a=e.target.closest('a[data-nav]');if(a){e.preventDefault();parent.postMessage({nav:a.dataset.nav},'*')}})";
  doc.body.appendChild(s);

async function buildHtml(name) { return processHtml(await textOf(byName[name]), name); }

/* ---------- markdown + csv renderers ---------- */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const safe = u => /^\s*(javascript|vbscript|data):/i.test(u) ? '#' : u.replace(/"/g, '&quot;');
function inl(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, (m, a, u) => '<img alt="' + a + '" src="' + safe(u) + '">');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, (m, t, u) => '<a href="' + safe(u) + '">' + t + '</a>');
  return s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
}
function mdToHtml(src) {
  const L = src.replace(/\r/g, '').split('\n'), out = []; let i = 0, list = null, para = [], m;
  const fp = () => { if (para.length) { out.push('<p>' + inl(para.join(' ')) + '</p>'); para = []; } };
  const cl = () => { if (list) { out.push('</' + list + '>'); list = null; } };
  while (i < L.length) {
    const l = L[i];
    if (/^```/.test(l)) { fp(); cl(); const buf = []; i++; while (i < L.length && !/^```/.test(L[i])) buf.push(L[i++]); i++; out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue; }
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { fp(); cl(); out.push('<h' + m[1].length + '>' + inl(m[2]) + '</h' + m[1].length + '>'); }

const MD_CSS = 'body{font:15px/1.6 system-ui,sans-serif;padding:16px;max-width:760px;margin:auto;color:#0f172a}pre{background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px;overflow:auto}code{background:#eef2ff;padding:1px 5px;border-radius:4px}pre code{background:none;padding:0}img{max-width:100%}blockquote{border-left:3px solid #a5b4fc;margin:8px 0;padding-left:12px;color:#64748b}a{color:#4f46e5}';
function parseCsv(t, d) {
  const rows = []; let r = [], c = '', q = false;
  for (let i = 0; i < t.length && rows.length < 502; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }

}

  const rows = parseCsv(t, d), more = rows.length > 500; if (more) rows.length = 500;
  const row = (r, tag) => '<tr>' + r.map(c => '<' + tag + '>' + esc(c) + '</' + tag + '>').join('') + '</tr>';
  return '<!DOCTYPE html><meta charset="utf-8"><style>body{margin:0;font:13px system-ui,sans-serif}table{border-collapse:collapse;min-width:100%}th,td{border:1px solid #e2e8f0;padding:6px 10px;white-space:nowrap;text-align:left}th{background:#eef2ff;position:sticky;top:0}tr:nth-child(even) td{background:#f8fafc}p{padding:8px 12px;color:#64748b}</style><table>' +
    (rows.length ? '<thead>' + row(rows[0], 'th') + '</thead><tbody>' + rows.slice(1).map(r => row(r, 'td')).join('') + '</tbody>' : '') + '</table>' + (more ? '<p>Showing the first 500 rows.</p>' : '');
}
async function showPreview(name) {
  tabs('tPrev'); $('#cw').style.display = 'none'; $('#find').style.display = 'none';
  const fr = $('#frame'); $('#pv').style.display = 'block'; $('#fsrow').style.display = 'block'; $('#pvt').textContent = base(name);
  const e = ext(name);

async function go(name, mode) {

}

/* ---------- full screen ---------- */
let apiFull = false;
function enterFull() {
  $('#pv').classList.add('full'); document.body.style.overflow = 'hidden';
  const p = $('#pv').requestFullscreen && $('#pv').requestFullscreen();
  if (p && p.then) p.then(() => apiFull = true).catch(() => {});
}

  if (!$('#pv').classList.contains('full')) return;
  $('#pv').classList.remove('full'); document.body.style.overflow = '';
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); apiFull = false;
}

$('#fs').onclick = enterFull; $('#exit').onclick = exitFull;

/* ---------- events ---------- */
$('#drop').onclick = () => $('#file').click();
$('#file').onchange = e => e.target.files[0] && loadZip(e.target.files[0]);

  $('#sm').textContent = searchMode === 'name' ? 'Names' : 'Contents';
  $('#q').placeholder = searchMode === 'name' ? '🔍 Search files…' : '🔍 Search inside files…';
  saveState(); runContent(); toast(searchMode === 'name' ? 'Searching file names' : 'Searching inside text files');
};

};

  if (!currentBytes) return;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([currentBytes], { type: mime(current) })); a.download = base(current); a.click();
};

$('#zipall').onclick = async () => {
  const hit = filtered(); if (!hit.length) return toast('No files to zip');
  toast('Packing ' + hit.length + ' files…');
  try {
    const items = []; for (const f of hit) items.push({ name: shown(f.name), data: await bytesOf(f) });
    const a = document.createElement('a'); a.href = URL.createObjectURL(makeZip(items)); a.download = 'extracted-files.zip'; a.click();
  } catch (e) { alert(e.message); }
};
$('#copy').onclick = async () => {
  const t = $('#code').textContent;
  try { await navigator.clipboard.writeText(t); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('Code copied');
};
$('#fmt').onclick = () => { jsonPretty = !jsonPretty; renderText(); };

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') exitFull();
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || !current) return;
  if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1);
});

/* ---------- dark mode ---------- */

/* ---------- restore last session ---------- */
(async () => {
  const blob = await idbGet(); if (!blob || !(await loadZip(blob, true))) return;
  let st = {}; try { st = JSON.parse(load('nzx-state') || '{}'); } catch (e) {}
  if (st.sort) { sortMode = st.sort; $('#sort').value = sortMode; }
  if (st.sm === 'content') { searchMode = 'content'; $('#sm').textContent = 'Contents'; $('#q').placeholder = '🔍 Search inside files…'; }
  if (st.wrap) wrap = true; if (st.fsz) fsz = st.fsz;
  (st.col || []).forEach(d => collapsed.add(d));
  if (st.q) { $('#q').value = st.q; if (searchMode === 'content') await runContent(); }
  renderList();
  if (st.cur && byName[st.cur]) await openFile(st.cur, st.prev ? 'preview' : undefined);
})();
