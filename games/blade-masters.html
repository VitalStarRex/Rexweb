<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blade Master</title>
<style>
:root{--bg:#0b0d14;--ink:#f1ece2;--dim:#9aa0b4;--steel:#6fe3ff;--ember:#ff5a3c;--panel:rgba(14,17,28,.82);
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d14}}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Gill Sans",Verdana,sans-serif;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);padding:12px 14px;display:flex;justify-content:space-between;gap:12px;pointer-events:none}
.bar{width:min(46vw,260px);height:12px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden}
#hp{height:100%;width:100%;background:linear-gradient(90deg,var(--ember),#ffb347);transition:width .15s}
.stat{font-size:13px;color:var(--dim);margin-top:6px}
#score{font-size:26px;font-weight:700;letter-spacing:.02em;text-align:right}
#combo{font-size:20px;color:var(--steel);text-align:right;min-height:26px;font-weight:700}
#banner{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:clamp(28px,8vw,56px);font-weight:700;letter-spacing:.06em;opacity:0;pointer-events:none;text-shadow:0 0 24px var(--steel);transition:opacity .4s}
#hurt{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 30px rgba(255,40,20,.7);opacity:0;transition:opacity .25s}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.seg button{padding:9px 14px;font-size:14px;font-weight:600;border:1px solid var(--dim);background:transparent;color:var(--dim);border-radius:4px}
.seg button.on{border-color:var(--steel);color:#06121a;background:var(--steel)}
#gear{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 84px);z-index:5;width:44px;height:44px;border-radius:50%;border:1px solid var(--dim);background:var(--panel);color:var(--ink);font-size:22px}
#start{z-index:4}#panel{z-index:6}#panel label{display:flex;gap:10px;align-items:center;font-size:17px}#panel h2{margin:0;font-size:30px}
#tip{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);text-align:center;color:var(--ink);font-size:16px;opacity:0;transition:opacity .4s;pointer-events:none;padding:0 20px;text-shadow:0 2px 8px #000}
@media (pointer:fine){#stick{display:none}}
.btn{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);border-radius:50%;border:2px solid var(--steel);background:var(--panel);color:var(--ink);font:700 15px inherit;display:none;align-items:center;justify-content:center}
#bSlash{right:22px;width:104px;height:104px;font-size:17px;box-shadow:0 0 24px rgba(111,227,255,.4)}
#bDash{right:140px;width:70px;height:70px;border-color:var(--dim)}
#stick{position:fixed;left:0;bottom:0;width:55%;height:50%}
#knob{position:fixed;width:90px;height:90px;border-radius:50%;border:2px solid var(--dim);margin:-45px 0 0 -45px;display:none;pointer-events:none}
#knob i{position:absolute;left:30px;top:30px;width:30px;height:30px;border-radius:50%;background:var(--steel);opacity:.8}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at center,rgba(11,13,20,.72),rgba(11,13,20,.96));text-align:center;padding:24px}
.screen h1{margin:0;font-size:clamp(40px,12vw,84px);letter-spacing:.04em;line-height:1}
.screen p{margin:0;max-width:34ch;color:var(--dim);line-height:1.5}
.go{padding:14px 34px;font:700 18px inherit;border:2px solid var(--steel);background:transparent;color:var(--steel);border-radius:4px;cursor:pointer}
.go:hover,.go:focus-visible{background:var(--steel);color:#06121a;outline:none}
</style>
</head>
<body>
<div id="hud"><div><div class="bar"><div id="hp"></div></div><div class="stat" id="wave">Wave 1</div></div><div><div id="score">0</div><div id="combo"></div></div></div>
<div id="hurt"></div><div id="tip"></div>
<button id="gear" aria-label="Settings">&#9881;</button>
<div id="panel" class="screen" style="display:none"><h2>Settings</h2>
<label><input type="checkbox" id="sSfx" checked> Sound effects</label>
<label><input type="checkbox" id="sMus" checked> Music</label>
<label>Volume <input type="range" id="sVol" min="0" max="1" step=".05" value=".7"></label>
<div class="seg"><button data-q="0">Low graphics</button><button data-q="1" class="on">High graphics</button></div>
<button class="go" id="sLand">Landscape view</button>
<button class="go" id="sClose">Resume</button></div><div id="banner"></div>
<div id="stick"></div><div id="knob"><i></i></div>
<button class="btn" id="bDash">Dash</button><button class="btn" id="bSlash">Slash</button>
<div class="screen" id="start">
<h1>Blade Master</h1>
<p>Hold the arena. Cut down every shade that reaches you and chain slashes into combos.</p>
<p id="how">WASD move · Space slash · Shift dash</p>
<p id="best"></p>
<div class="seg" id="diffSeg"><button data-d="easy">Easy</button><button data-d="normal">Normal</button><button data-d="hard" class="on">Hard</button><button data-d="nightmare">Nightmare</button></div>
<button class="go" id="go">Enter the arena</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

 for(const s of[-1,1]){const e=new THREE.Mesh(new THREE.BoxGeometry(.07,.05,.04),new THREE.MeshBasicMaterial({color:0x111111}));e.position.set(s*.11,1.92,.3);g.add(e);const br=new THREE.Mesh(new THREE.BoxGeometry(.12,.03,.04),new THREE.MeshBasicMaterial({color:0x20150d}));br.position.set(s*.11,1.98,.3);br.rotation.z=s*.4;g.add(br);}

 }

 g.scale.setScalar(boss?1.9:tough?1.25:1);
 g.position.set(Math.cos(a)*17,0,Math.sin(a)*17);scene.add(g);
 enemies.push({g,tel,legs:lg,arm:rA,wind:0,body:b,hp:Math.max(1,Math.round((boss?22:tough?4:2)*DM().hp)),cd:.5,kx:0,kz:0,flash:0,sp:Math.min(3+w*.5,7)*DM().sp*(boss?.7:tough?.85:1),tough,boss});
}
function startWave(){S.wave++;spawnQ=[0,10,15,20,24][S.wave];spawnT=0;waveClear=false;$('wave').textContent='Level '+S.wave+' / 4';banner(S.wave===4?'Final level':'Level '+S.wave);if(S.wave===4)spawn(true);}
function reset(){
 enemies.forEach(e=>scene.remove(e.g));enemies=[];
 S={on:true,hp:100,score:0,wave:0,combo:0,comboT:0};
 Object.assign(P,{n:0,fin:false,x:0,z:0,f:0,vx:0,vz:0,dash:0,dashCd:0,sl:1,inv:0});
 $('start').style.display='none';$('score').textContent=0;tipSeq();ac();music();$('combo').textContent='';$('hp').style.width='100%';
 if(touch)document.querySelectorAll('.btn').forEach(b=>b.style.display='flex');
 startWave();
}
function slash(){
 if(!S.on||paused||P.sl<.7)return;
 let n=null,nd=7;enemies.forEach(e=>{const d=Math.hypot(e.g.position.x-P.x,e.g.position.z-P.z);if(d<nd){nd=d;n=e;}});
 if(n)P.f=Math.atan2(n.g.position.x-P.x,n.g.position.z-P.z);
 P.sl=0;P.hit=false;P.dir*=-1;P.n=(P.n||0)+1;P.fin=P.n%3===0;P.fin?SFX.fin():SFX.slash();
}
function dash(){
 if(!S.on||paused||P.dashCd>0)return;
 let mx=stick.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),mz=stick.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 const l=Math.hypot(mx,mz);
 if(l>.1){P.vx=mx/l;P.vz=mz/l;}else{P.vx=Math.sin(P.f);P.vz=Math.cos(P.f);}
 P.dash=.22;P.dashCd=1;P.inv=.35;SFX.dash();
}
function applyHit(){
 let hits=0;if(P.fin)burst({x:P.x,y:0,z:P.z},0x6fe3ff,28,10);
 enemies.forEach(e=>{
  const dx=e.g.position.x-P.x,dz=e.g.position.z-P.z,d=Math.hypot(dx,dz);
  let da=Math.atan2(dx,dz)-P.f;da=Math.atan2(Math.sin(da),Math.cos(da));
  if(d<(P.fin?4.8:3.7)&&(P.fin||Math.abs(da)<1.4)){
   e.hp-=P.fin?2:1;e.flash=.12;if(!e.tough){e.wind=0;e.tel.material.opacity=0;e.cd=.6;}e.kx=dx/d*9;e.kz=dz/d*9;hits++;
   burst(e.g.position,0xff5a3c,6);
  }});
 if(hits){hs=.07;SFX.hit();S.combo+=hits;S.comboT=2;shake=.35;}
}
function killEnemy(e){
 scene.remove(e.g);enemies.splice(enemies.indexOf(e),1);SFX.die();
 burst(e.g.position,e.tough?0xb06bff:0xff8a3c,16,8);
 S.score+=(e.boss?300:e.tough?30:10)*Math.max(1,1+Math.floor(S.combo/5));
 $('score').textContent=S.score;
}
function win(){S.on=false;S.score+=Math.round(S.hp)*5;SFX.win();try{if(S.score>best){best=S.score;localStorage.setItem('bm_best',best);}}catch(e){}$('score').textContent=S.score;$('start').style.display='flex';$('start').querySelector('h1').textContent='Victory';$('start').querySelector('p').textContent='All 4 levels cleared on '+DM().name+'. Final score '+S.score+'.';$('best').textContent='Best score: '+best;$('go').textContent='Play again';document.querySelectorAll('.btn').forEach(b=>b.style.display='none');}
function die(){
 S.on=false;
 try{if(S.score>best){best=S.score;localStorage.setItem('bm_best',best);}}catch(e){}
 $('start').style.display='flex';
 SFX.lose();$('start').querySelector('h1').textContent='Fallen';
 $('start').querySelector('p').textContent='You reached level '+S.wave+' with '+S.score+' points.';
 $('best').textContent='Best score: '+best;$('go').textContent='Fight again';
 document.querySelectorAll('.btn').forEach(b=>b.style.display='none');
}

function update(dt){
 const t=performance.now()/1000;
 // input
 let mx=stick.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),mz=stick.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 const l=Math.hypot(mx,mz);if(l>1){mx/=l;mz/=l;}
 if(S.on){
  if(P.dash>0){P.dash-=dt;P.x+=P.vx*20*dt;P.z+=P.vz*20*dt;burst({x:P.x,y:0,z:P.z},0x6fe3ff,1,1);}
  else{const sp=P.sl<.6?3.5:7;P.x+=mx*sp*dt;P.z+=mz*sp*dt;
   if(l>.15&&P.sl>=.6){let da=Math.atan2(mx,mz)-P.f;da=Math.atan2(Math.sin(da),Math.cos(da));P.f+=da*Math.min(1,dt*14);}}
  P.dashCd-=dt;P.inv-=dt;
  const r=Math.hypot(P.x,P.z);if(r>16.3){P.x*=16.3/r;P.z*=16.3/r;}
  if(P.sl<1){P.sl+=dt/.3;if(!P.hit&&P.sl>.3){P.hit=true;applyHit();}}
  if(S.comboT>0){S.comboT-=dt;if(S.comboT<=0)S.combo=0;}
  $('combo').textContent=(S.combo>1?S.combo+' hit combo':'')+((P.n||0)%3===2?(S.combo>1?' · ':'')+'finisher ready':'');
  // spawning
  if(spawnQ>0){spawnT-=dt;if(spawnT<=0&&enemies.length<12){spawn();spawnQ--;spawnT=Math.max(.25,.9-S.wave*.1);}}
  else if(!enemies.length&&!waveClear){waveClear=true;if(S.wave>=4){win();}else{S.hp=Math.min(100,S.hp+10);$('hp').style.width=S.hp+'%';setTimeout(()=>{if(S.on)startWave()},1800);}}
 }
 // player visuals
 player.position.set(P.x,0,P.z);player.rotation.y=P.f;
 const k=Math.min(P.sl,1),e=1-Math.pow(1-k,3);
 pivot.rotation.y=P.sl<1?(P.fin?P.dir*(-3.1+6.2*e):P.dir*(1.3-2.6*e)):.9*P.dir*-1;
 pivot.rotation.z=P.sl<1?0:0;
 trail.scale.x=1;trail.material.opacity=P.sl<1?(1-P.sl)*.45:0;trail.rotation.z=P.dir>0?0:0;
 trail.scale.set(P.dir*(P.fin?1.4:1),P.fin?1.4:1,1);
 pl.position.set(P.x,3,P.z);
 const wk=S.on?Math.min(1,l*1.5):0;legs.forEach((g,i)=>g.rotation.x=Math.sin(t*12)*.7*wk*(i?1:-1));cape.rotation.x=.2+wk*.5+Math.sin(t*5)*.05;
 // enemies
 enemies.slice().forEach(en=>{
  const p=en.g.position,dx=P.x-p.x,dz=P.z-p.z,d=Math.hypot(dx,dz)||1;
  en.g.rotation.y=Math.atan2(dx,dz);
  if(d>1.4&&en.wind<=0){p.x+=dx/d*en.sp*dt;p.z+=dz/d*en.sp*dt;}
  p.x+=en.kx*dt;p.z+=en.kz*dt;en.kx*=1-Math.min(1,dt*8);en.kz*=1-Math.min(1,dt*8);
  enemies.forEach(o=>{if(o!==en){const ox=p.x-o.g.position.x,oz=p.z-o.g.position.z,od=Math.hypot(ox,oz);if(od<1&&od>0){p.x+=ox/od*dt*2;p.z+=oz/od*dt*2;}}});
  en.body.position.y=1.15+Math.sin(t*9+en.sp*7)*.03;en.legs.forEach((q,i)=>q.rotation.x=Math.sin(t*9+en.sp*7)*.6*(i?1:-1)*(en.wind>0?0:1));
  en.flash-=dt;en.body.material.emissive.setHex(en.flash>0?0xffffff:0x220000);
  en.cd-=dt;
  if(S.on&&en.wind<=0&&d<(en.boss?3.6:2.4)&&en.cd<=0){en.wind=.4;SFX.warn();}
  let strike=false;if(en.wind>0){en.wind-=dt;const q=1-en.wind/.4;en.tel.material.opacity=.3+.7*q;en.tel.scale.setScalar(1+q);en.arm.rotation.x=-1.1-1.9*q;if(en.wind<=0){en.sw=.2;en.hitT=.1;en.cd=.65;en.tel.material.opacity=0;noise(.12,1200,.12);}}
  if(en.hitT>0){en.hitT-=dt;if(en.hitT<=0)strike=true;}
  if(en.sw>0){en.sw-=dt;en.arm.rotation.x=-3+2.8*Math.min(1,1-en.sw/.2);}else if(en.wind<=0)en.arm.rotation.x+=(-1.1-en.arm.rotation.x)*Math.min(1,dt*8);
  if(S.on&&strike&&d<(en.boss?3.4:2.2)){
   if(P.inv<=0){S.hp-=(en.boss?40:en.tough?24:14)*DM().dmg;SFX.hurt();shake=.5;$('hurt').style.opacity=1;setTimeout(()=>$('hurt').style.opacity=0,160);S.combo=0;
    $('hp').style.width=Math.max(0,S.hp)+'%';if(S.hp<=0){die();}}}
  if(en.hp<=0)killEnemy(en);
 });
 // particles
 for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life-=dt;q.vy-=14*dt;
  q.m.position.x+=q.vx*dt;q.m.position.z+=q.vz*dt;q.m.position.y=Math.max(.05,q.m.position.y+q.vy*dt);
  q.m.scale.setScalar(Math.max(.01,Math.min(1,q.life*1.6)));
  if(q.life<=0){scene.remove(q.m);parts.splice(i,1);}}
 rune.rotation.z+=dt*.1;rune2.material.color.setHSL(.58,.8,.3+.15*Math.sin(t*2));
 for(let i=0;i<EN;i++){ep[i*3+1]+=ev[i]*dt;ep[i*3]+=Math.sin(t+i)*dt*.4;if(ep[i*3+1]>10)ep[i*3+1]=0;}embers.geometry.attributes.position.needsUpdate=true;
 lightn-=dt;if(Math.random()<dt*.12){lightn=.18;setTimeout(()=>SFX.thunder(),300);}sun.intensity=lightn>0?2.6:.9;scene.background.setHex(lightn>0?0x1a2036:0x0b0d14);flames.forEach((q,i)=>{const k=.8+Math.sin(t*9+i*2)*.15+Math.random()*.1;q.L.intensity=k;q.f.scale.set(k,k*1.2,k);});
 // camera
 shake=Math.max(0,shake-dt*2);
 cam.position.set(P.x*.8+(Math.random()-.5)*shake,11.5+(Math.random()-.5)*shake*.5,P.z*.8+10);
 cam.lookAt(P.x*.8,0,P.z*.8-1);
}

function loop(ms){const dt=Math.min(.05,(ms-last)/1000||0);last=ms;let d2=dt;if(hs>0){hs-=dt;d2*=.05;}try{update(paused?0:d2);R.render(scene,cam);}catch(err){console.error(err);}requestAnimationFrame(loop);}
requestAnimationFrame(loop);

// Input
try{spawn();burst({x:0,y:0,z:0},0xff5a3c,1);R.compile(scene,cam);enemies.forEach(e=>scene.remove(e.g));enemies=[];parts.forEach(q=>scene.remove(q.m));parts.length=0;}catch(x){}
$('go').onclick=reset;
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{diff=b.dataset.d;[...b.parentNode.children].forEach(x=>x.classList.toggle('on',x===b));});
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const hq=b.dataset.q==='1';sun.castShadow=hq;R.setPixelRatio(hq?Math.min(devicePixelRatio,touch?1.5:2):1);resize();[...b.parentNode.children].forEach(x=>x.classList.toggle('on',x===b));});
function setPause(p){paused=p;$('panel').style.display=p?'flex':'none';}
$('gear').onclick=()=>{ac();setPause(true);};$('sClose').onclick=()=>setPause(false);
$('sSfx').onchange=e=>{sfxOn=e.target.checked;};$('sMus').onchange=e=>{musOn=e.target.checked;music();};
$('sVol').oninput=e=>{vol=+e.target.value;if(drone)drone.g.gain.value=.05*vol;};
function lp(e){return forced?{x:e.clientY,y:innerWidth-e.clientX}:{x:e.clientX,y:e.clientY};}
$('sLand').onclick=async()=>{try{await document.documentElement.requestFullscreen();}catch(e){}let ok=false;try{await screen.orientation.lock('landscape');ok=true;}catch(e){}
 if(!ok&&innerHeight>innerWidth&&!forced){forced=true;}else{forced=false;}
 $('sLand').textContent=forced||ok?'Landscape on (tap to turn off)':'Landscape view';setTimeout(resize,150);resize();};
addEventListener('keydown',e=>{if(e.key==='Escape'||e.key.toLowerCase()==='p')setPause(!paused);});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;
 if(k===' '){e.preventDefault();slash();}
 if(k==='shift')dash();
 if(k==='enter'&&!S.on)reset();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('mousedown',e=>{if(S.on&&e.target===R.domElement)slash();});
const bS=$('bSlash'),bD=$('bDash');
bS.addEventListener('pointerdown',e=>{e.preventDefault();slash();});
bD.addEventListener('pointerdown',e=>{e.preventDefault();dash();});
let sid=null,sx=0,sy=0;const knob=$('knob'),st=$('stick');
st.addEventListener('pointerdown',e=>{sid=e.pointerId;const q=lp(e);sx=q.x;sy=q.y;st.setPointerCapture(sid);
 knob.style.display='block';knob.style.left=sx+'px';knob.style.top=sy+'px';});
st.addEventListener('pointermove',e=>{if(e.pointerId!==sid)return;
 const q=lp(e);let dx=q.x-sx,dy=q.y-sy;const d=Math.hypot(dx,dy),m=45;
 if(d>m){dx=dx/d*m;dy=dy/d*m;}
 stick.x=dx/m;stick.y=dy/m;knob.firstElementChild.style.transform='translate('+dx+'px,'+dy+'px)';});
const endS=e=>{if(e.pointerId!==sid)return;sid=null;stick.x=stick.y=0;knob.style.display='none';knob.firstElementChild.style.transform='';};
st.addEventListener('pointerup',endS);st.addEventListener('pointercancel',endS);
</script>
