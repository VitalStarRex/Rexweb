<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050914">
<title>Extra Arcade | RexWeb Nexora</title>
<style>
:root{color-scheme:dark;--bg:#050914;--panel:#0b1425;--cyan:#35e8ff;--purple:#9b6cff;--green:#43f5a5;--pink:#ff4fd8;--text:#eef7ff;--muted:#91a6c4}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#10223b,var(--bg) 65%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
button,select{font:inherit}
button{cursor:pointer;touch-action:manipulation}
header{padding:22px 14px 15px;text-align:center}
.brand{color:var(--cyan);font-size:12px;letter-spacing:4px;font-weight:900}
h1{font-size:clamp(25px,6vw,42px);margin:8px 0;text-shadow:0 0 22px #35e8ff55}
header p{color:var(--muted);margin:5px 0}
main{width:min(100%,900px);margin:auto;padding:0 12px 30px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 2px}
.section-head h2{font-size:18px;margin:0}
.count{font-size:11px;color:var(--cyan);border:1px solid #35e8ff66;padding:5px 9px;border-radius:20px}
#game-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.game-card{position:relative;overflow:hidden;min-height:130px;padding:13px;text-align:left;color:var(--text);background:linear-gradient(135deg,#101c31,#09101f);border:1px solid #35e8ff66;border-radius:16px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;isolation:isolate;box-shadow:inset 0 0 24px #35e8ff08;transition:transform .15s,border-color .15s}
.game-card:active{transform:scale(.97)}
.game-card:focus-visible{outline:2px solid white;outline-offset:2px}
.game-card:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 90% 10%,var(--glow,#35e8ff)33,transparent 65%);opacity:.22}
.game-icon{font-size:30px;line-height:1}
.game-name{display:block;font-size:14px;font-weight:850}
.game-type{display:block;font-size:9px;letter-spacing:1.1px;color:var(--muted);margin-top:4px}
.game-art{position:absolute;right:10px;top:12px;width:42px;height:42px;border-radius:50%;border:1px solid var(--glow);opacity:.3;box-shadow:0 0 22px var(--glow)}
footer{text-align:center;color:var(--muted);font-size:11px;padding:22px 8px}
#game-screen{display:none;position:fixed;inset:0;z-index:10;background:#050914;overflow-y:auto;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
#game-screen.open{display:block}
.game-top{position:sticky;top:0;z-index:2;background:#050914ee;backdrop-filter:blur(12px);display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #243550}
.game-top h2{font-size:16px;flex:1;min-width:0;margin:0;text-align:center}
.ui-btn,.control-btn{border:1px solid #35e8ff88;background:#0c1b2d;color:var(--text);border-radius:10px;padding:10px 12px;font-weight:750;font-size:12px}
.ui-btn:active,.control-btn:active{background:#17364a}
#difficulty{max-width:100px;background:#101c30;color:white;border:1px solid #35e8ff88;border-radius:9px;padding:9px;font-size:12px}
#game-help{text-align:center;color:var(--muted);font-size:12px;line-height:1.5;margin:12px auto;max-width:520px}
#play-area{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:520px;margin:0 auto;padding-bottom:22px}
.hud{width:100%;display:flex;justify-content:space-around;gap:5px;flex-wrap:wrap;background:#0b1425;border:1px solid #233c58;border-radius:10px;padding:10px;font-size:12px;font-weight:800}
canvas{display:block;width:min(100%,360px);height:auto;aspect-ratio:3/4;background:#070d1c;border:1px solid #35e8ff66;border-radius:12px;touch-action:none}
.controls{width:100%;display:flex;justify-content:center;align-items:stretch;gap:8px;flex-wrap:wrap}
.control-btn{min-width:64px;min-height:43px;flex:1}
#result-toast{font-size:14px;font-weight:850;color:var(--green);text-align:center;min-height:20px}
@media(min-width:560px){#game-grid{grid-template-columns:repeat(5,minmax(0,1fr))}.game-card{min-height:155px}.game-icon{font-size:34px}}
@media(max-width:350px){#game-grid{gap:7px}.game-card{padding:10px;min-height:120px}.game-name{font-size:12px}.game-type{font-size:8px}.ui-btn{padding:9px 8px;font-size:11px}}
</style>
</head>
<body>
<header>
  <div class="brand">REXWEB NEXORA</div>
  <h1>EXTRA ARCADE</h1>
  <p>Ten fresh challenges. One arcade universe.</p>
</header>

<main>
  <div class="section-head">
    <h2>Choose Your Game</h2>
    <span class="count">10 GAMES</span>
  </div>
  <div id="game-grid" aria-label="Arcade games">
    <p style="color:#91a6c4">Loading games…</p>
  </div>
</main>

<footer>REXWEB NEXORA · PLAY WITHOUT LIMITS</footer>

<section id="game-screen" aria-label="Game screen" aria-hidden="true">
  <div class="game-top">
    <button id="back-button" class="ui-btn" type="button">← Games</button>
    <h2 id="game-title">Game</h2>
    <select id="difficulty" aria-label="Difficulty">
      <option>Easy</option>
      <option selected>Medium</option>
      <option>Hard</option>
      <option>Hardest</option>
    </select>
    <button id="restart-button" class="ui-btn" type="button">↻</button>
  </div>
  <p id="game-help">Choose a game to begin.</p>
  <div id="play-area"></div>
</section>

<script src="./game2.js" defer></script>
</body>
</html>
