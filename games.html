<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050914">
  <title>Games Hub | RexWeb Nexora</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050914;
      color: #f4f7ff;
      font-family: system-ui, Arial, sans-serif;
    }

    .page-header {
      padding: 18px 14px;
      text-align: center;
      border-bottom: 1px solid #233451;
      background: #080e1d;
    }

    .page-header h1 {
      margin: 0;
      font-size: clamp(23px, 5vw, 34px);
      font-weight: 900;
      background: linear-gradient(90deg, #fff, #37b6ff, #a78bfa);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .page-header p {
      margin: 6px 0 0;
      color: #9eabc5;
      font-size: 13px;
    }

    .back-link {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 16px;
      border: 1px solid #344765;
      border-radius: 10px;
      background: #17243c;
      color: white;
      text-decoration: none;
    }

    #nexora-games {
      min-height: 70vh;
    }

    #loading-error {
      margin: 20px auto;
      padding: 16px;
      max-width: 500px;
      text-align: center;
      color: #ffb4c4;
      background: #24101b;
      border: 1px solid #713149;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <header class="page-header">
    <h1>REXWEB NEXORA</h1>
    <p>PLAY. CREATE. TRADE. GROW.</p>
    <a class="back-link" href="index.html">← Back to Home</a>
  </header>

  <main id="nexora-games">
    <div id="loading-error">Loading your 10 games…</div>
  </main>

  <script>
    window.addEventListener("error", function (event) {
      const message = document.getElementById("loading-error");

      if (message) {
        message.textContent =
          "A JavaScript error stopped the arcade from loading. Check that game.js is in the same folder as games.html.";
      }
    });
  </script>

  <script src="./game.js"></script>

  <script>
    window.addEventListener("load", function () {
      const message = document.getElementById("loading-error");
      if (message) message.remove();
    });
  </script>
</body>
</html>
