<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050914">
  <meta name="description" content="Play free arcade games on RexWeb Nexora. Explore exciting arcade challenges, puzzles, racing, action, and more.">

  <title>Games Hub | RexWeb Nexora</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #050914;
      color-scheme: dark;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050914;
      color: #f4f7ff;
      font-family: system-ui, Arial, sans-serif;
      overflow-x: hidden;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .page-header {
      position: relative;
      padding: 24px 14px;
      text-align: center;
      background:
        radial-gradient(ellipse at top, rgba(55, 182, 255, .12), transparent 65%),
        #080e1d;
      border-bottom: 1px solid #233451;
    }

    .page-header h1 {
      margin: 0;
      font-size: clamp(25px, 5vw, 38px);
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #fff, #37b6ff, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .page-header p {
      margin: 9px 0 18px;
      color: #9eabc5;
      font-size: 12px;
      letter-spacing: 1.5px;
      line-height: 1.7;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 10px 17px;
      border: 1px solid #344765;
      border-radius: 10px;
      background: #17243c;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      transition: background .2s, border-color .2s, transform .2s;
    }

    .back-link:hover {
      background: #223654;
      border-color: #37b6ff;
    }

    .back-link:active {
      transform: scale(.97);
    }

    #nexora-games {
      width: 100%;
      min-height: 70vh;
      padding-bottom: 24px;
    }

    #loading-error {
      width: calc(100% - 28px);
      max-width: 520px;
      margin: 25px auto;
      padding: 18px;
      text-align: center;
      line-height: 1.6;
      border: 1px solid #344765;
      border-radius: 12px;
      background: #101d34;
      color: #c7d9f7;
      overflow-wrap: anywhere;
    }

    #loading-error.error {
      color: #ffb4c4;
      border-color: #713149;
      background: #24101b;
    }

    .page-footer {
      padding: 20px 14px;
      text-align: center;
      border-top: 1px solid #233451;
      background: #080e1d;
      color: #8494b2;
      font-size: 12px;
      line-height: 1.7;
    }

    .page-footer strong {
      color: #37b6ff;
    }

    @media (max-width: 480px) {
      .page-header {
        padding: 21px 12px;
      }

      .page-header p {
        font-size: 11px;
        letter-spacing: 1px;
      }

      #nexora-games {
        min-height: 65vh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <header class="page-header">
    <h1>REXWEB NEXORA</h1>
    <p>PLAY • CREATE • COMPETE • GROW</p>

    <a class="back-link" href="index.html">
      <span aria-hidden="true">←</span>
      <span>Back to Home</span>
    </a>
  </header>

  <main id="nexora-games">
    <div id="loading-error" role="status" aria-live="polite">
      Loading Nexora Arcade...
    </div>
  </main>

  <footer class="page-footer">
    <strong>REXWEB NEXORA</strong>
    <br>
    Your arcade universe. Play, challenge yourself, and have fun.
    <br>
    &copy; <span id="current-year"></span> RexWeb Nexora.
  </footer>

  <script>
    (() => {
      "use strict";

      const loadingBox = document.getElementById("loading-error");
      const arcadeRoot = document.getElementById("nexora-games");

      document.getElementById("current-year").textContent =
        new Date().getFullYear();

      let arcadeStarted = false;

      function showError(message) {
        if (!loadingBox) return;

        loadingBox.hidden = false;
        loadingBox.classList.add("error");
        loadingBox.textContent = message;
      }

      window.addEventListener("error", function (event) {
        if (event.target && event.target !== window) {
          const failedSource = event.target.src || "";

          if (failedSource.includes("game.js")) {
            showError(
              "Could not load game.js. Check that the file exists beside games.html."
            );
          }

          return;
        }

        console.error(
          "Arcade JavaScript error:",
          event.message
        );
      }, true);

      function checkArcade() {
        if (!arcadeRoot) return;

        const hasGames = arcadeRoot.querySelector(
          "canvas, .nx-game-card, .nx-game, .game-card, .game-container, button"
        );

        if (hasGames) {
          arcadeStarted = true;

          if (loadingBox && loadingBox.parentNode) {
            loadingBox.remove();
          }
        }
      }

      const observer = new MutationObserver(checkArcade);

      observer.observe(arcadeRoot, {
        childList: true,
        subtree: true
      });

      setTimeout(function () {
        checkArcade();

        if (!arcadeStarted && loadingBox && loadingBox.parentNode) {
          showError(
            "The arcade has not started. Check that game.js is saved beside games.html."
          );
        }
      }, 5000);
    })();
  </script>

  <!-- Load ONLY the original arcade. -->
  <script src="./game.js"></script>

</body>
</html>
