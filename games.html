<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050914">

  <title>Games Hub | RexWeb Nexora</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050914;
      color: #f4f7ff;
      font-family: system-ui, Arial, sans-serif;
    }

    .page-header {
      padding: 22px 14px;
      text-align: center;
      background: #080e1d;
      border-bottom: 1px solid #233451;
    }

    .page-header h1 {
      margin: 0;
      font-size: clamp(25px, 5vw, 38px);
      font-weight: 900;
      background: linear-gradient(90deg, #fff, #37b6ff, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .page-header p {
      color: #9eabc5;
      font-size: 13px;
    }

    .back-link {
      display: inline-block;
      padding: 10px 16px;
      border: 1px solid #344765;
      border-radius: 10px;
      background: #17243c;
      color: white;
      text-decoration: none;
    }

    #nexora-games {
      min-height: 70vh;
    }

    #loading-error {
      max-width: 520px;
      margin: 25px auto;
      padding: 18px;
      text-align: center;
      border: 1px solid #344765;
      border-radius: 12px;
      background: #101d34;
      color: #c7d9f7;
    }

    #loading-error.error {
      color: #ffb4c4;
      border-color: #713149;
      background: #24101b;
    }
  </style>
</head>

<body>
  <header class="page-header">
    <h1>REXWEB NEXORA</h1>
    <p>PLAY • CREATE • COMPETE • GROW</p>

    <a class="back-link" href="index.html">
      ← Back to Home
    </a>
  </header>

  <main id="nexora-games">
    <div id="loading-error">
      Loading the Nexora Arcade...
    </div>
  </main>

  <script>
    window.addEventListener("error", function (event) {
      const box = document.getElementById("loading-error");

      if (!box) return;

      box.classList.add("error");

      if (event.target && event.target !== window) {
        box.textContent =
          "Could not load a required file. Check that game.js exists beside games.html.";
      } else {
        box.textContent =
          "A JavaScript error occurred. Check game.js and try again.";
      }
    }, true);

    window.addEventListener("load", function () {
      setTimeout(function () {
        const box = document.getElementById("loading-error");
        const root = document.getElementById("nexora-games");

        // Keep the error visible if the arcade never replaced it.
        if (box && root && box.parentNode === root) {
          box.classList.add("error");
          box.textContent =
            "The arcade did not start. Check the game.js filename and its location.";
        }
      }, 1000);
    });
  </script>

  <script src="./game.js"></script>
</body>
</html>
