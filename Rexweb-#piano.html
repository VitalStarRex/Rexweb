<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<title>Nexora Piano</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
:root{--bg:#060a18;--panel:#0d1630;--panel2:#13204a;--line:#22376b;--ink:#eef3ff;--muted:#8fa3cc;--accent:#35e8ff;--violet:#9b6cff;color-scheme:dark;
--font:"Chakra Petch",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;background:radial-gradient(900px 420px at 15% -8%,#9b6cff29,transparent 70%),radial-gradient(800px 380px at 95% 0%,#35e8ff4d,transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--font);
padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.app{max-width:1000px;margin:0 auto}
header{text-align:center;margin:6px 0 14px}
.brand{font-size:11px;letter-spacing:.28em;color:var(--accent);font-weight:700}
h1{margin:6px 0 0;font-size:clamp(1.6rem,6vw,2.6rem);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 26px #35e8ff55}
.panel{background:linear-gradient(165deg,var(--panel),var(--bg));border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 20px 50px -28px #000}
.ctrl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media(min-width:700px){.ctrl{grid-template-columns:repeat(4,minmax(0,1fr))}}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
select,button,input[type=range]{font-family:var(--font)}
select,.btn{font-size:14px;font-weight:600;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;min-height:42px;padding:0 10px;cursor:pointer;touch-action:manipulation}
.btn:hover,select:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);color:#00141c;border-color:var(--accent);font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:6px;align-items:center}
.row .btn{flex:1;padding:0}
.oct{min-width:44px;text-align:center;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);height:42px}
.disp{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:#050914}
.note{font-size:28px;font-weight:700;color:var(--accent);min-width:90px;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted);text-align:right}
.kbwrap{overflow:hidden;border-radius:12px;background:#050914;padding:10px 10px 12px;border:1px solid var(--line);touch-action:none}
.kb{position:relative;display:flex;height:clamp(170px,34vh,300px);width:100%;user-select:none;-webkit-user-select:none}
.w{position:relative;flex:1 1 0;min-width:0;height:100%;border:0;border-right:2px solid #050914;border-radius:0 0 10px 10px;background:linear-gradient(#fff,#e7ecf8 85%,#cfd8ee);color:#2a3558;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font:700 12px var(--font);box-shadow:0 5px 0 #8f9bc2,0 8px 14px #0008;cursor:pointer;touch-action:none}
.w.on{background:linear-gradient(#bff6ff,var(--accent));box-shadow:0 1px 0 #1b8da0;transform:translateY(3px)}
.b{position:absolute;top:0;height:62%;z-index:2;border:0;border-radius:0 0 8px 8px;background:linear-gradient(#2b3560,#0a0f22 85%);color:#aab6dd;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font:700 10px var(--font);box-shadow:0 4px 0 #000,0 6px 10px #000a;cursor:pointer;touch-action:none}
.b.on{background:linear-gradient(#b99bff,var(--violet));color:#fff;box-shadow:0 1px 0 #3a1f8a;transform:translateY(3px)}
.names .w:after,.names .b:after{content:attr(data-n)}
.lab .w:after{content:attr(data-k)}
.lab .b:after{content:attr(data-k);color:inherit}
.foot{margin-top:12px;text-align:center;font-size:11px;letter-spacing:.14em;color:var(--muted)}

.rec{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#050914}
.rec h3{margin:0 0 10px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.rrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rrow .btn{flex:1 1 auto;min-width:0;white-space:nowrap}
.btn.recb{background:#ff3b5c;border-color:#ff3b5c;color:#fff;font-weight:700}
.btn.recb.live{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.tm{font-size:20px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;min-width:62px;text-align:center}
.meter{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#43f5a5,#35e8ff,#ff5d7d)}
.rmsg{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.45;min-height:16px}
.res{margin-top:10px}.res audio{width:100%;height:44px}
.res .rrow{margin-top:8px}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
@media(max-width:600px){body{padding-top:max(8px,env(safe-area-inset-top))}header{margin:0 0 8px}h1{font-size:1.4rem}.panel{padding:8px;border-radius:14px}.ctrl{gap:8px;margin-bottom:8px}.hint,.foot{display:none}.disp{padding:4px 12px;margin-bottom:8px}.note{font-size:22px}.w{font-size:10px}.b{font-size:9px}.kbwrap{padding:6px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header><div class="brand">REXWEB NEXORA</div><h1>Grand Piano</h1></header>
  <div class="panel">
    <div class="ctrl">
      <div class="f"><label for="snd">Sound</label>
        <select id="snd"><option value="0">Grand Piano</option><option value="1">Electric Piano</option><option value="2">Synth Lead</option><option value="3">Music Box</option></select></div>
      <div class="f"><label>Octave</label>
        <div class="row"><button class="btn" id="oDn" type="button" aria-label="Octave down">−</button><span class="oct" id="oVal">4</span><button class="btn" id="oUp" type="button" aria-label="Octave up">+</button></div></div>
      <div class="f"><label for="vol">Volume</label><input id="vol" type="range" min="0" max="100" value="70"></div>
      <div class="f"><label>Options</label>
        <div class="row"><button class="btn" id="bSus" type="button" aria-pressed="false">Sustain</button><button class="btn on" id="bLab" type="button" aria-pressed="true">Labels</button></div></div>
    </div>
    <div class="disp"><div class="note" id="note">—</div><div class="hint">Keys: A S D F G H J K L ; ' · black: W E T Y U O P<br>Hold Space for sustain</div></div>
    <div class="kbwrap" id="wrap"><div class="kb lab" id="kb"></div></div>
  </div>
  <div class="panel rec">
    <h3>Voice + Piano Recorder</h3>
    <div class="rrow">
      <button class="btn recb" id="rBtn" type="button">● Record</button>
      <span class="tm" id="rTime">0:00</span>
      <button class="btn on" id="rMic" type="button" aria-pressed="true">🎤 My voice: on</button>
    </div>
    <div class="meter" aria-hidden="true"><i id="rLvl"></i></div>
    <p class="rmsg" id="rMsg">Tip: use headphones so the piano does not leak into your microphone. Press Record, sing or talk, and play.</p>
    <div class="res" id="rRes" hidden>
      <audio id="rAud" controls></audio>
      <div class="rrow"><a class="btn primary on" id="rDl" href="#">⬇ Download</a><button class="btn" id="rDel" type="button">Delete</button></div>
    </div>
  </div>
  <div class="foot">REXWEB NEXORA · PLAY ANYTHING</div>
</div>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var BLACK={1:1,3:1,6:1,8:1,10:1};
var KEYMAP=['a','w','s','e','d','f','t','g','y','h','u','j','k','o','l','p',';',"'"];

var COUNT=25,oct=4,sound=0,vol=0.7,sustainBtn=false,spaceDown=false,AC=null,master=null;
var dest=null,voices={},held={},sustained={};
var SOUNDS=[
 {a:'triangle',b:'sine',bm:2,bg:0.35,lp:3200,dec:1.6,tail:5},
 {a:'sine',b:'triangle',bm:1,bg:0.25,lp:2400,dec:1.0,tail:3},
 {a:'sawtooth',b:'square',bm:1.005,bg:0.2,lp:1800,dec:0.8,tail:2.5},
 {a:'sine',b:'sine',bm:4,bg:0.4,lp:6000,dec:0.5,tail:2}
];
function audio(){
  if(!AC){
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      var comp=AC.createDynamicsCompressor();
      master=AC.createGain();master.gain.value=vol;
      master.connect(comp);comp.connect(AC.destination);dest=AC.createMediaStreamDestination();comp.connect(dest);
    }catch(e){AC=null}
  }
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function freq(i){return 440*Math.pow(2,((12*(oct+1)+i)-69)/12)}
function start(i){
  if(!audio()||voices[i])return;
  var S=SOUNDS[sound],t=AC.currentTime,f=freq(i);
  var g=AC.createGain(),lp=AC.createBiquadFilter(),o1=AC.createOscillator(),o2=AC.createOscillator(),g2=AC.createGain();
  lp.type='lowpass';lp.frequency.setValueAtTime(Math.min(S.lp*2,f*8+800),t);
  lp.frequency.exponentialRampToValueAtTime(Math.max(400,Math.min(S.lp,f*3)),t+S.dec);
  o1.type=S.a;o2.type=S.b;o1.frequency.value=f;o2.frequency.value=f*S.bm;g2.gain.value=S.bg;
  var peak=0.38*(1-Math.min(0.5,(f-130)/2600));
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(peak,t+0.008);
  g.gain.exponentialRampToValueAtTime(peak*0.35,t+S.dec);
  g.gain.exponentialRampToValueAtTime(0.0001,t+S.tail+S.dec);
  o1.connect(g);o2.connect(g2);g2.connect(g);g.connect(lp);lp.connect(master);
  o1.start(t);o2.start(t);
  voices[i]={g:g,o:[o1,o2]};
}
function stop(i,fast){
  var v=voices[i];if(!v)return;
  delete voices[i];
  var t=AC.currentTime,cur=v.g.gain.value;
  v.g.gain.cancelScheduledValues(t);
  v.g.gain.setValueAtTime(Math.max(cur,0.0001),t);
  v.g.gain.setTargetAtTime(0.0001,t,fast?0.04:0.12);
  v.o.forEach(function(o){try{o.stop(t+(fast?0.3:1.0))}catch(e){}});
}
var keys=[];
function sus(){return sustainBtn||spaceDown}
function down(i){
  if(held[i])return;
  held[i]=true;delete sustained[i];
  if(voices[i])stop(i,true);
  start(i);
  keys[i].classList.add('on');
  var n=NAMES[i%12]+(oct+Math.floor(i/12));
  $('#note').textContent=n;
}
function up(i){
  if(!held[i])return;
  delete held[i];
  keys[i].classList.remove('on');
  if(sus())sustained[i]=true;else stop(i,false);
}
function releaseSustain(){
  if(sus())return;
  Object.keys(sustained).forEach(function(k){delete sustained[k];if(!held[k])stop(+k,false)});
}
// build keyboard (fits the screen width)
var kb=$('#kb');
function wantCount(){return window.innerWidth<600?13:25}
function build(){
  Object.keys(held).forEach(function(k){up(+k)});
  Object.keys(voices).forEach(function(k){stop(+k,true)});
  kb.innerHTML='';keys=[];COUNT=wantCount();
  var W=0;for(var n=0;n<COUNT;n++)if(!BLACK[n%12])W++;
  var wi=0,ww=100/W;
  for(var i=0;i<COUNT;i++){
    var s=i%12,isB=!!BLACK[s],el=document.createElement('button');
    el.type='button';el.tabIndex=-1;el.className=isB?'b':'w';
    var km=KEYMAP[i];if(km)el.dataset.k=km.toUpperCase();
    el.dataset.n=NAMES[s]+(Math.floor(i/12)+oct);
    el.setAttribute('aria-label',NAMES[s]);
    if(isB){el.style.width=(ww*0.6)+'%';el.style.left=(wi*ww-ww*0.3)+'%'}else{wi++}
    kb.appendChild(el);keys.push(el);
    (function(idx,e){
      e.addEventListener('pointerdown',function(ev){try{e.releasePointerCapture(ev.pointerId)}catch(_){}down(idx)});
      e.addEventListener('pointerenter',function(ev){if(ev.buttons)down(idx)});
      ['pointerup','pointerleave','pointercancel'].forEach(function(n){e.addEventListener(n,function(){up(idx)})});
      e.addEventListener('contextmenu',function(ev){ev.preventDefault()});
    })(i,el);
  }
}
build();
var rt=0;
window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(wantCount()!==COUNT)build()},150)});
// keyboard
window.addEventListener('keydown',function(e){
  if(e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;
  var t=e.target&&e.target.tagName;
  if(e.key===' '&&t!=='BUTTON'&&t!=='SELECT'){e.preventDefault();spaceDown=true;return}
  if(t==='SELECT')return;
  var i=KEYMAP.indexOf(e.key.toLowerCase());
  if(i>=0)down(i);
});
window.addEventListener('keyup',function(e){
  if(e.key===' '){spaceDown=false;releaseSustain();return}
  var i=KEYMAP.indexOf(e.key.toLowerCase());
  if(i>=0)up(i);
});
window.addEventListener('blur',function(){
  Object.keys(held).forEach(function(k){up(+k)});spaceDown=false;releaseSustain();
});
// controls
function relabel(){keys.forEach(function(e,i){e.dataset.n=NAMES[i%12]+(Math.floor(i/12)+oct)})}
function setOct(n){
  Object.keys(held).forEach(function(k){up(+k)});
  oct=Math.max(1,Math.min(6,n));$('#oVal').textContent=oct;relabel();
}
$('#oDn').addEventListener('click',function(){setOct(oct-1)});
$('#oUp').addEventListener('click',function(){setOct(oct+1)});
$('#snd').addEventListener('change',function(e){sound=+e.target.value;e.target.blur()});
$('#vol').addEventListener('input',function(e){vol=e.target.value/100;if(master)master.gain.value=vol});
$('#bSus').addEventListener('click',function(e){
  sustainBtn=!sustainBtn;e.currentTarget.classList.toggle('on',sustainBtn);e.currentTarget.setAttribute('aria-pressed',String(sustainBtn));
  releaseSustain();
});
$('#bLab').addEventListener('click',function(e){
  var on=!kb.classList.contains('lab');
  kb.classList.toggle('lab',on);e.currentTarget.classList.toggle('on',on);e.currentTarget.setAttribute('aria-pressed',String(on));
});

// ===== recorder: mixes the piano and your microphone =====
var rec=null,chunks=[],micStream=null,micSrc=null,analyser=null,tInt=0,t0=0,useMic=true,recUrl=null;
function rmsg(t){$('#rMsg').textContent=t}
function pickMime(){
  var l=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
  if(!window.MediaRecorder)return null;
  for(var i=0;i<l.length;i++)if(MediaRecorder.isTypeSupported(l[i]))return l[i];
  return '';
}
function fmt(ms){var s=Math.floor(ms/1000);return Math.floor(s/60)+':'+('0'+s%60).toString().slice(-2)}
function begin(){
  chunks=[];var m=pickMime();
  try{rec=new MediaRecorder(dest.stream,m?{mimeType:m}:undefined)}catch(e){rmsg('Recording is not supported on this browser.');cleanMic();return}
  rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
  rec.onstop=finish;rec.start();t0=Date.now();
  $('#rBtn').textContent='■ Stop';$('#rBtn').classList.add('live');
  var buf=analyser?new Uint8Array(analyser.fftSize):null;
  tInt=setInterval(function(){
    $('#rTime').textContent=fmt(Date.now()-t0);
    if(analyser){analyser.getByteTimeDomainData(buf);var p=0;for(var i=0;i<buf.length;i++)p=Math.max(p,Math.abs(buf[i]-128));$('#rLvl').style.width=Math.min(100,p/128*160)+'%'}
  },100);
  rmsg(useMic?'Recording your voice and the piano...':'Recording the piano only...');
}
function cleanMic(){
  if(micSrc){try{micSrc.disconnect()}catch(e){}micSrc=null}
  if(micStream){micStream.getTracks().forEach(function(t){t.stop()});micStream=null}
  analyser=null;$('#rLvl').style.width='0';
}
function finish(){
  clearInterval(tInt);cleanMic();
  $('#rBtn').textContent='● Record';$('#rBtn').classList.remove('live');
  var type=(rec&&rec.mimeType)||'audio/webm',blob=new Blob(chunks,{type:type});
  if(recUrl)URL.revokeObjectURL(recUrl);
  recUrl=URL.createObjectURL(blob);
  $('#rAud').src=recUrl;$('#rRes').hidden=false;
  var ext=type.indexOf('mp4')>=0?'m4a':type.indexOf('ogg')>=0?'ogg':'webm';
  $('#rDl').href=recUrl;$('#rDl').download='nexora-piano-take.'+ext;
  rmsg('Saved. Press play to listen, or download your recording.');
}
function startRec(){
  if(!window.MediaRecorder){rmsg('Recording is not supported on this browser.');return}
  if(!audio())return;
  if(!useMic){begin();return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){rmsg('The microphone needs a secure page (https). Turn off My voice to record piano only.');return}
  rmsg('Allow microphone access when your browser asks...');
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}).then(function(st){
    micStream=st;micSrc=AC.createMediaStreamSource(st);
    var g=AC.createGain();g.gain.value=1.2;micSrc.connect(g);g.connect(dest);
    analyser=AC.createAnalyser();analyser.fftSize=512;micSrc.connect(analyser);
    begin();
  }).catch(function(){rmsg('Microphone blocked. Allow it in your browser settings, or turn off My voice to record piano only.')});
}
$('#rBtn').addEventListener('click',function(){
  if(rec&&rec.state==='recording')rec.stop();else startRec();
});
$('#rMic').addEventListener('click',function(e){
  if(rec&&rec.state==='recording')return;
  useMic=!useMic;var b=e.currentTarget;b.classList.toggle('on',useMic);b.setAttribute('aria-pressed',String(useMic));
  b.textContent='🎤 My voice: '+(useMic?'on':'off');
});
$('#rDel').addEventListener('click',function(){
  $('#rAud').pause();$('#rAud').removeAttribute('src');$('#rRes').hidden=true;
  if(recUrl){URL.revokeObjectURL(recUrl);recUrl=null}
  $('#rTime').textContent='0:00';rmsg('Deleted. Ready for a new take.');
});
document.addEventListener('visibilitychange',function(){if(document.hidden){Object.keys(held).forEach(function(k){up(+k)})}});
})();
</script>
</body>
</html>
